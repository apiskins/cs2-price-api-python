# Publishes to PyPI when a release is published on GitHub (Releases → Draft a new release).
# The release's tag must match pyproject.toml's version, e.g. v1.0.0.
#
# No token: PyPI trusts this workflow. Set it up once on pypi.org → Your account → Publishing →
# Add a new pending publisher: project "cs2-price-api", this repo's owner and name, workflow
# "publish.yml", environment "pypi".

name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches pyproject.toml
        run: test "v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "${{ github.event.release.tag_name }}"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
